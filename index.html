/* ── LEAD SCORING ──────────────────────────────────────────────────────────────
   Grades every lead so the pixel can optimise for value instead of volume, and
   so the CRM knows which leads to call first.

   TUNE THESE TWO TABLES. They drive the value sent to Meta.
   COMMISSION_PCT is your average commission as a share of the amount financed.
   Replace the placeholders with your real Access Lending Group schedule. */
const COMMISSION_PCT = {
  business: 0.080,   /* highest category, mostly low doc. 8 to 10% quoted, 8 used. */
  car:      0.040,   /* lands around $1.6k on a $40k car, matches the $1-2k range */
  caravan:  0.040,   /* asset finance, assumed to behave like car until measured  */
  personal: 0.020    /* lowest commission of the four                             */
};
/* Share of leads at each grade that reach settlement, PER FUNNEL. Business is the
   easiest to settle and personal the hardest, so these cannot share one number.
   Personal is set low deliberately: 46 debt consolidation leads produced zero
   settlements. Update all of these from the CRM as real data accumulates. */
const SETTLE_RATE = {
  business: { strong:0.35, medium:0.18, weak:0.05 },
  car:      { strong:0.20, medium:0.10, weak:0.02 },
  caravan:  { strong:0.18, medium:0.09, weak:0.02 },
  personal: { strong:0.10, medium:0.04, weak:0.01 }
};
/* Biggest deal we realistically settle per funnel. The valuation uses the lower
   of the requested amount and this, so an aspirational slider drag cannot
   dominate what Meta learns. Raise these only if you actually settle that size. */
const VALUE_AMOUNT_CAP = { car:150000, caravan:150000, personal:75000, business:250000 };
/* Sanity ceiling on any single lead, in dollars of expected commission. Nothing
   should be able to swamp Meta's learning off one enquiry. */
const VALUE_HARD_CAP = 8000;

/* Is the amount they asked for plausible against their capacity to service it?
   Returns ok, stretch, unrealistic, or unknown when we have nothing to compare. */
function capacityCheck(){
  try{
    const s = st[funnel];
    const amt = +s.amount || 0;
    if(funnel === 'business'){
      const turn = +s.turn || 0;
      if(turn <= 0) return { level:'unknown', ratio:null };
      const r = amt / turn;
      return { level: r <= 0.75 ? 'ok' : r <= 1.5 ? 'stretch' : 'unrealistic', ratio:r };
    }
    /* Consumer. income is gross annual, derived from take-home pay.
       If they never entered a wage, income is only a default, so do not judge. */
    if(!s.wage) return { level:'unknown', ratio:null };
    const inc = +s.income || 0;
    if(inc <= 0) return { level:'unknown', ratio:null };
    const r = amt / inc;
    return { level: r <= 1.0 ? 'ok' : r <= 2.0 ? 'stretch' : 'unrealistic', ratio:r };
  }catch(e){ return { level:'unknown', ratio:null }; }
}

function leadQuality(){
  try{
    const s = st[funnel];
    let matches = 0;
    try{ matches = (match().list || []).length; }catch(e){ matches = 0; }
    let grade = 'weak', reasons = [];

    if(funnel === 'business'){
      const abnOK   = s.abn  >= 24;          // 2+ years trading
      const gstOK   = s.gst  >= 12;          // GST registered 12+ months
      const turnOK  = s.turn >= 250000;
      const propOK  = s.property === 'owner' || s.property === 'spouse';
      if(abnOK && gstOK && (turnOK || propOK) && matches > 0){
        grade = 'strong';
        reasons.push('ABN 2yr+', gstOK?'GST 1yr+':'', turnOK?'turnover $250k+':'', propOK?'director property':'');
      } else if(s.abn >= 12 && matches > 0){
        grade = 'medium';
        reasons.push('ABN 1yr+');
      } else {
        grade = 'weak';
        if(s.abn < 12) reasons.push('ABN under 12 months');
        if(s.gst === 0) reasons.push('not GST registered');
        if(matches === 0) reasons.push('no lender match');
      }
    } else {
      /* car, caravan and personal all run on income */
      const emp = s.emp;
      if(emp === 'centrelink'){
        grade = 'weak'; reasons.push('Centrelink income');
      } else if((emp === 'fulltime' || emp === 'self') && s.credit >= 3 && matches > 0){
        grade = 'strong'; reasons.push('stable income', 'good credit');
      } else if(matches > 0){
        grade = 'medium';
        if(emp === 'casual') reasons.push('casual income');
        if(s.credit <= 2)    reasons.push('credit needs work');
      } else {
        grade = 'weak'; reasons.push('no lender match');
      }
    }

    /* Reality check the amount before it becomes a value signal. */
    const cap = capacityCheck();
    if(cap.level === 'unrealistic'){
      grade = 'weak';
      reasons.push('amount not serviceable');
    } else if(cap.level === 'stretch' && grade === 'strong'){
      grade = 'medium';
      reasons.push('amount is a stretch');
    }

    const key    = (ASSET === 'caravan' && funnel === 'car') ? 'caravan' : funnel;
    const pct    = COMMISSION_PCT[key] || 0.03;
    const rate   = (SETTLE_RATE[key] && SETTLE_RATE[key][grade]) || 0.03;
    const capAmt = VALUE_AMOUNT_CAP[key] || 100000;
    /* Value the deal they could realistically get, not the one they asked for.
       Someone requesting $500k on $80k turnover may still be a real customer,
       but the deal on the table is the serviceable one. */
    let servAmt = Infinity;
    if(funnel === 'business' && (+s.turn || 0) > 0) servAmt = (+s.turn) * 0.75;
    else if(funnel !== 'business' && s.wage && (+s.income || 0) > 0) servAmt = (+s.income) * 1.0;
    const valAmt = Math.min(+s.amount || 0, capAmt, servAmt);
    const value  = Math.min(Math.round(valAmt * pct * rate), VALUE_HARD_CAP);

    return {
      grade: grade,
      qualified: grade !== 'weak',
      value: value,
      matches: matches,
      realism: cap.level,
      ratio: cap.ratio === null ? '' : cap.ratio.toFixed(2),
      capped: (+s.amount || 0) > capAmt,
      reasons: reasons.filter(Boolean).join(', ')
    };
  }catch(e){
    /* Never let scoring break a real lead. */
    return { grade:'medium', qualified:true, value:0, matches:0,
             realism:'unknown', ratio:'', capped:false, reasons:'' };
  }
}

function qualityFields(){

    lender_matches:  String(q.matches),
    lead_signals:    q.reasons,
    amount_realism:  q.realism || 'unknown',
    capacity_ratio:  q.ratio || ''
  };
}

 if(g>135000)t+=(Math.min(g,190000)-135000)*0.37;

 return t;}
// 2% Medicare levy with low-income shade-in (2025-26 single threshold ~$27,222-$34,027)
function medicare(g){if(g<=27222)return 0;if(g<34027)return (g-27222)*0.10;return g*0.02;}
function totalTax(g){return incomeTax(g)+medicare(g);}
// Reverse: given NET (after-tax take-home) annual, solve for GROSS (before-tax) salary.
function grossFromNet(net){
 if(net<=18200)return net; // under tax-free threshold, net≈gross
 let lo=net, hi=net*2, gross=net;
 for(let i=0;i<60;i++){gross=(lo+hi)/2;const n=gross-totalTax(gross);if(n>net)hi=gross;else lo=gross;}
 return Math.round(gross/100)*100;}
function annualWage(amt,freq){const m={weekly:52,fortnightly:26,monthly:12,annually:1}[freq]||1;return amt*m;}

// visa subclasses most lenders decline outright (working holiday, bridging, transit)
const TOUGH_VISAS=["417","462","010","020","030","other"];
function visaMonthsLeft(s){if(!s.visaExpiry)return null;const exp=new Date(s.visaExpiry+"-01");const m=Math.round((exp-new Date())/(1000*60*60*24*30.44));return m;}
function visaPenalty(l,s){ // returns extra soft-fails for visa situation
 if(s.visa!=="temp"&&s.visa!=="bridging")return 0;
 let p=0;
 // lender that's PR-only can't do any visa
 if(l.res==="pr")return 99; // effectively excludes (handled as soft so still shows in near-miss)
 // tough visa types: only the most flexible lenders
 if(TOUGH_VISAS.includes(s.visaSub))p++;
 if(s.visa==="bridging")p++;
 // visa must outlast loan term (+1 month buffer)
 const m=visaMonthsLeft(s);
 if(m!==null && m < s.term*12+1)p++;
 return p;}

function match(){const s=st[funnel];let pool=[];
 if(funnel==="car")pool=carPool();else if(funnel==="personal")pool=DATA.personal;
 else pool=s.sub==="cashflow"?DATA.bizC:s.sub==="asset"?DATA.bizA:DATA.bizA.concat(DATA.bizC); // null/any => both
 const sc=pool.map(l=>{let f=0,hard=false;
  if(s.amount<l.min||s.amount>l.max){f++;hard=true;}if(s.term>l.term){f++;hard=true;}
  if(funnel==="car"){if(s.credit<l.credit)f++;if(s.cond==="used"&&l.age<8)f++;f+=Math.min(visaPenalty(l,s),3);if(s.payday==="yes"&&l.payday!=="recent_ok")f++;}
  if(funnel==="personal"){if(s.credit<l.credit)f++;if(s.income<l.income)f++;f+=Math.min(visaPenalty(l,s),3);if(s.purpose==="debt"&&l.name==="UME Loans")f++;}
  if(funnel==="business"){if(l.abn&&s.abn<l.abn)f++;if(l.gst&&s.gst<l.gst)f++;if(l.turn&&s.turn<l.turn)f++;}
  return{l,f,hard};});
 let ex=sc.filter(x=>x.f===0).map(x=>x.l).sort((a,b)=>a.lo-b.lo);let fb=ex.length<2;
 if(ex.length<4){const have=new Set(ex.map(l=>l.name));const xt=sc.filter(x=>!x.hard&&!have.has(x.l.name)).sort((a,b)=>a.f-b.f||a.l.lo-b.l.lo).map(x=>x.l);for(const e of xt){if(ex.length>=4)break;if(!ex.find(l=>l.name===e.name))ex.push(e);}}
 // amount-capped: lenders that would qualify but the requested amount EXCEEDS their max (only reason)
 const inList=new Set(ex.map(l=>l.name));
 const capped=pool.filter(l=>!inList.has(l.name)&&s.amount>l.max&&s.term<=l.term&&l.max>=(funnel==="business"?50000:5000)).sort((a,b)=>b.max-a.max);
 const capNames=new Set(capped.map(l=>l.name));
 // near-miss: fits amount & term, but fails 1-2 SOFT criteria (not amount/term). Shows "may still qualify".
 const nearmiss=sc.filter(x=>!inList.has(x.l.name)&&!capNames.has(x.l.name)&&!x.hard&&x.f>0&&x.f<=2)
   .sort((a,b)=>a.f-b.f||a.l.lo-b.l.lo).map(x=>({l:x.l,reasons:missReasons(x.l,s)}));
 return{list:ex,fallback:fb&&ex.length>0,capped,nearmiss};}

function missReasons(l,s){const r=[];
 if(funnel==="business"){if(l.abn&&s.abn<l.abn)r.push("longer ABN history");if(l.gst&&s.gst<l.gst)r.push("longer GST registration");if(l.turn&&s.turn<l.turn)r.push("higher turnover");}
 if(funnel==="car"){if(s.credit<l.credit)r.push("stronger credit");if(s.cond==="used"&&l.age<8)r.push("a newer vehicle");if((s.visa==="temp"||s.visa==="bridging")&&l.res==="pr")r.push("PR or citizenship");if((s.visa==="temp"||s.visa==="bridging")&&l.res==="any"){const m=visaMonthsLeft(s);if(m!==null&&m<s.term*12+1)r.push("a visa that outlasts the loan");}if(s.payday==="yes"&&l.payday!=="recent_ok")r.push("no active payday loans");}
 if(funnel==="personal"){if(s.credit<l.credit)r.push("stronger credit");if(s.income<l.income)r.push("higher income");}
 return r;}

// Car-loan balloon cap by term (real lender policy, not novated-lease ATO table).
// Shorter term = higher cap. 7yr = none. Used cars reduced by age.
function balloonMaxPct(){const s=st[funnel];
 // base cap by term
 const byTerm={1:50,2:50,3:50,4:40,5:35,6:30,7:0};
 let cap=byTerm[s.term]!==undefined?byTerm[s.term]:0;
 // car funnel: reduce for older vehicles
 if(funnel==="car"){
   if(s.found==="yes"){
     if(s.cond==="used")cap=Math.max(0,cap-15);       // used: lenders tighten ~15%
     else if(s.cond==="demo")cap=Math.max(0,cap-5);   // demo: slight reduction
   }
 }
 // business asset: only secured (handled by where balloonBox is shown); cap a touch lower
 if(funnel==="business")cap=Math.min(cap,40);
 return cap;}
function balloonMaxDollar(){const s=st[funnel];const pct=balloonMaxPct();return Math.round(s.amount*pct/100/500)*500;}

function balloonBox(){const s=st[funnel];const cap=balloonMaxPct();const maxBalloon=balloonMaxDollar();
 if(cap<=0){if(s.balloon>0)st[funnel].balloon=0;
   return `<div class="hl"><div class="ht">Balloon payment</div><div class="hs">${s.term>=7?"Balloon payments aren't available on 7-year terms. Choose a shorter term to add one.":"A balloon isn't available for this option."}</div></div>`;}
 // clamp existing balloon to the new cap

   ...(extra||{}),

   fbp:afhCtx.fbp||afhCookie('_fbp'),fbc:afhCtx.fbc||afhCookie('_fbc'),
   client_user_agent:navigator.userAgent,event_time:String(Math.floor(Date.now()/1000)),postcode:(st[funnel]&&st[funnel].postcode)||"",
   landing_page:afhCtx.url||location.href,utm_source:afhCtx.utm_source||"",utm_campaign:afhCtx.utm_campaign||"",utm_content:afhCtx.utm_content||"",fbclid:afhCtx.fbclid||"",
   _subject:`${leadQuality().grade==='strong'?'[HOT] ':leadQuality().grade==='weak'?'[LOW] ':''}New AFH lead: ${contact.name} - ${lead["Loan type"]} ${lead["Amount requested"]} (${action})`};
 // Fire the Meta Lead event FIRST, independently of Formspree's response.
 // Formspree receives and emails the lead even when the browser later throws a
 // CORS error reading the response - so gating the pixel on the fetch resolving
 // (or on res.ok) silently drops real Leads. We count the Lead at the moment of
 // submit, then send to Formspree separately.
 if(FORMSPREE_ID!=="YOUR_FORM_ID" && typeof fbq==="function" && !noPixel){
   try{
     const q = leadQuality();
     try{const nm=(contact.name||"").trim().toLowerCase().split(/\s+/);let ph=(contact.mobile||"").replace(/[^0-9]/g,"");if(ph.indexOf("0")===0)ph="61"+ph.slice(1);
       const ud={em:(contact.email||"").trim().toLowerCase(),ph:ph,fn:nm[0]||"",ln:nm.length>1?nm[nm.length-1]:"",country:"au"};
       const pc=(st[funnel]&&st[funnel].postcode)||"";if(pc)ud.zp=pc;
       fbq('init','1029171376262400',ud);}catch(e){}
     /* Send an expected value with every Lead so Meta can optimise for revenue
        rather than raw form fills. */
     fbq('track','Lead',{
       content_name: lead["Loan type"]+" loan",
       content_category: lead["Loan type"],
       value: q.value,
       currency: 'AUD',
       lead_grade: q.grade,
       funnel: funnel,
       loan_amount: +st[funnel].amount||0,
       loan_term: +st[funnel].term||0,
       loan_purpose: funnel==="personal"?(st.personal.purpose||""):funnel==="car"?(st.car.found==="no"?"still looking":(st.car.cond||"")):(st.business.sub||""),
       asset: ASSET
     },{eventID: data.event_id});
     /* Only leads that can realistically settle. Use THIS as the optimisation
        event once an ad set is producing enough of them. */
     if(q.qualified){
       fbq('trackCustom','QualifiedLead',{
         content_category: lead["Loan type"],
         value: q.value,
         currency: 'AUD',
         lead_grade: q.grade
       },{eventID: "q_"+data.event_id});
     }
   }catch(e){}
 }
 try{
  afhPost({afhLead:{event_id:data.event_id,type:lead["Loan type"]}});
  if(FORMSPREE_ID==="YOUR_FORM_ID")return; // not configured - skip silently
  await fetch("https://formspree.io/f/"+FORMSPREE_ID,{method:"POST",keepalive:true,headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify(data)});
 }catch(e){/* Formspree still receives + emails the lead even if the response read throws */}
}


function quickFreqMul(){return{weekly:52,fortnightly:26,monthly:12}[repayFreq]||52;}
function quickRepay(){const s=st[funnel];const{list}=match();if(!list.length)return null;
 const r=disp(list[0].lo,list[0].hi)[0];const wk=weekly(s.amount,r,s.term,s.balloon||0);
 const per=Math.round(wk*52/quickFreqMul());return{per,rate:r,n:list.length};}
function quickCalc(){const s=st[funnel];const amax={car:250000,personal:100000,business:500000}[funnel];const amin={car:2000,personal:2000,business:5000}[funnel];
 const maxBalloon=Math.round(s.amount*0.5/500)*500;const bpct=s.amount?Math.round(s.balloon/s.amount*100):0;
 const q=quickRepay();const freqWord={weekly:"week",fortnightly:"fortnight",monthly:"month"}[repayFreq];
 return `<div class="qc">
   <div class="qcrow"><div class="qclabel">Loan amount</div><div class="qcval" id="amtval" onclick="editAmt()">${fmt(s.amount)}</div></div>
   <input type="text" id="amtedit" class="amtedit" inputmode="numeric" value="${s.amount}" onblur="amtCommit(this.value)" onkeydown="if(event.key==='Enter')this.blur()" style="display:none">
   <input class="qcslider" type="range" min="${amin}" max="${amax}" step="1000" value="${s.amount}" oninput="amtSlide(this.value)">
   <div class="ends"><span>${fmtK(amin)}</span><span>${fmtK(amax)}</span></div>

   <div class="qcrow" style="margin-top:20px"><div class="qclabel">Loan term</div><div class="qcval2">${s.term} yr${s.term>1?'s':''}</div></div>
   <input class="qcslider" type="range" min="1" max="7" step="1" value="${s.term}" oninput="quickTerm(this.value)">
   <div class="ends"><span>1 yr</span><span>7 yrs</span></div>

   <div class="qcrow" style="margin-top:20px"><div class="qclabel">Balloon / residual <span style="color:var(--muteSoft);font-weight:600">(optional)</span></div><div class="qcval2">${fmt(s.balloon)}${s.balloon>0?` <span style="font-size:13px;color:var(--mute)">(${bpct}%)</span>`:''}</div></div>
   <input class="qcslider" type="range" min="0" max="${maxBalloon}" step="500" value="${s.balloon}" oninput="quickBalloon(this.value)">
   <div class="ends"><span>$0</span><span>${fmtK(maxBalloon)} (50%)</span></div>

   <div class="qclabel" style="margin-top:20px">Repayment frequency</div>
   <div class="qcfreq">${["weekly","fortnightly","monthly"].map(f=>`<button class="qcfreqbtn ${repayFreq===f?'on':''}" onclick="setFreq('${f}')">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>

   <div class="qcpreview" id="qcPreview">${q?`<div class="qcpl">Estimated repayment</div><div class="qcpv">${fmt(q.per)}<span>/${freqWord}</span></div><div class="qcps">from ${q.rate.toFixed(2)}% p.a.</div>`:`<div class="qcpl">Set your amount to see an estimate</div>`}</div>

   ${q?`<div class="qcready"><span class="qcdot"></span><span id="qcReady">${q.n} lenders ready to compare your rate</span></div>`:''}
   <button class="qccta pulse-cta" onclick="goFullFunnel()">See my ${q?q.n+' ':''}lender matches <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
   <div class="qctrust">${ICON.shield} No credit impact · 2 minutes · No upfront cost</div>
 </div>`;}
function refreshQuick(){const p=document.getElementById('qcPreview');if(!p)return;const q=quickRepay();const fw={weekly:"week",fortnightly:"fortnight",monthly:"month"}[repayFreq];p.innerHTML=q?`<div class="qcpl">Estimated repayment</div><div class="qcpv">${fmt(q.per)}<span>/${fw}</span></div><div class="qcps">from ${q.rate.toFixed(2)}% p.a.</div>`:`<div class="qcpl">Set your amount to see an estimate</div>`;const rd=document.getElementById('qcReady');if(rd&&q)rd.textContent=q.n+" lenders ready to compare your rate";const ct=document.querySelector('.qccta');if(ct&&q)ct.firstChild.textContent="See my "+q.n+" lender matches ";}
function quickTerm(v){st[funnel].term=+v;render();}
function quickBalloon(v){st[funnel].balloon=+v;render();}
function setFreq(f){repayFreq=f;render();}
function goFullFunnel(){view="form";qi=0;signalParent("form");render();window.scrollTo(0,0);}


/* ── TRACKING + HOST HANDSHAKE ─────────────────────────────────────────────── */
let afhStarted=false,afhCtx={},afhSeen={};
function afhTrack(name,params,std){try{if(typeof fbq!=="function")return;params=Object.assign({funnel:(typeof funnel!=="undefined"?funnel:""),asset:ASSET},params||{});fbq(std?'track':'trackCustom',name,params);}catch(e){}}
function afhOnce(key,name,params,std){if(afhSeen[key])return;afhSeen[key]=1;afhTrack(name,params,std);}
function afhStart(){if(afhStarted)return;afhStarted=true;afhTrack('CalculatorStart');}
function afhCookie(n){const m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):"";}
function afhPost(o){try{if(window.parent&&window.parent!==window)window.parent.postMessage(o,"*");}catch(e){}}
window.addEventListener("message",function(e){const d=e.data;if(!d||typeof d!=="object")return;
 if(d.afhParent){afhCtx=Object.assign(afhCtx,d.ctx||{});if(window.__afhRelay)window.__afhRelay();}
 if(d.afhAnswer){const a=d.afhAnswer;try{
   if(a.ctx)afhCtx=Object.assign(afhCtx,a.ctx);
   afhStart();
   if(typeof funnel==="undefined"||!st[funnel])return;
   st[funnel][a.k]=(typeof a.v==="number")?+a.v:a.v;
   view="form";qi=0;
   if(a.adv){next();}else{render();}
   afhTrack('CalcAnswer',{step:1,answer:String(a.k)+':'+String(a.v),source:'landing'});
 }catch(err){console.error(err);}}
});
function render(){tabs();document.getElementById("screen").innerHTML=view==="chooser"?chooser():view==="quick"?quickCalc():view==="form"?form():view==="details"?detailsGate():view==="analysing"?analysing():view==="ready"?readyScreen():view==="unlocking"?unlocking():results();applyView();paintRanges();
 afhPost({afhCalcView:{view:view,qi:qi,funnel:funnel}});
 if(view==="details")afhOnce('details','CalcDetailsForm',{});
 if(view==="results")afhOnce('results','CalcViewedMatches',{});
 if(view==="ready"){afhOnce('ready','CalcResultsReady',{});countUp();}
}

function signalParent(mode){try{if(window.parent&&window.parent!==window){window.parent.postMessage({afhCalc:true,mode:mode},"*");}}catch(e){/* ignore */}}
function goForm(){view="form";signalParent("form");render();window.scrollTo(0,0);}

function applyView(){document.body.classList.toggle("embed",!!EMBED);document.body.classList.toggle("fullresults",view==="results");}
render();
// Fire Meta top-of-funnel signal once the calculator has loaded
afhPost({afhCalcReady:true});
</script>
<script>
/* Embedded auto-height: tell the parent page how tall we are so the iframe never clips a step. */
(function(){
  if(window.parent===window) return;            // only when embedded
  var last=0;
  function report(force){
    // Measure actual content (bottom edge of body's children), not scrollHeight,
    // which can never be smaller than the iframe viewport and so ratchets upward.
    var h=0, kids=document.body.children;
    for(var i=0;i<kids.length;i++){
      var r=kids[i].getBoundingClientRect();
      var bottom=r.bottom+(window.scrollY||document.documentElement.scrollTop||0);
      if(bottom>h)h=bottom;
    }
    h=Math.ceil(h)+24; // breathing room
    // force=true re-sends even if unchanged, so a parent whose listener attached
    // late (common on iOS Safari) still receives the height of a static first step.
    if(force||Math.abs(h-last)>2){ last=h; parent.postMessage({afhCalcHeight:h}, "*"); }
  }
  function reportForced(){ report(true); }
  if(window.ResizeObserver){ new ResizeObserver(function(){report();}).observe(document.body); }
  window.addEventListener("load", reportForced);
  window.addEventListener("resize", function(){report();});
  document.addEventListener("click", function(){ setTimeout(report,60); }, true); // after step changes
  window.addEventListener("pageshow", reportForced);            // iOS back/forward cache
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(reportForced); } // fonts change text height
  // staged forced re-posts cover a parent whose message listener attaches after our first post
  [100,300,600,1000,1600,2500,4000].forEach(function(ms){ setTimeout(reportForced, ms); });
  setInterval(function(){report();}, 800);          // ongoing safety net (guarded)
  reportForced();
})();
</script>
